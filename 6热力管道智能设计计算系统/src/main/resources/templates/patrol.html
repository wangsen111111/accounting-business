<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>巡检管理</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="fragments :: sidebar('patrol')"></div><div th:replace="fragments :: topbar('巡检管理')"></div><main class="main">
<div class="page-title"><div><h1>巡检管理</h1><p>登记换热站巡检情况，留存现场检查记录</p></div></div><div th:if="${message}" class="notice" th:text="${message}"></div>
<section class="card" style="margin-bottom:18px"><div class="card-head"><h3>新增巡检记录</h3></div><form method="post" th:action="@{/patrol/save}" class="form-grid">
<label>巡检站点<select name="station"><option th:each="s:${stations}" th:value="${s.station_name}" th:text="${s.station_name}"></option></select></label><label>巡检人员<input name="inspector" required></label><label>巡检结果<select name="result"><option>正常</option><option>发现异常</option><option>需跟进</option></select></label><label style="grid-column:span 3">巡检备注<input name="note"></label><div class="form-actions"><button class="btn">保存巡检记录</button></div></form></section>
<section class="card"><div class="card-head"><h3>巡检记录</h3></div><table><thead><tr><th>站点</th><th>巡检人员</th><th>结果</th><th>备注</th><th>巡检时间</th></tr></thead><tbody><tr th:each="r:${records}"><td th:text="${r.station_name}"></td><td th:text="${r.inspector}"></td><td th:text="${r.result}"></td><td th:text="${r.note}"></td><td th:text="${r.patrol_time}"></td></tr></tbody></table></section></main></body></html>
