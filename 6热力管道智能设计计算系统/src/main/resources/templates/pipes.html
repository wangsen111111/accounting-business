<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管道档案 - 智慧热力</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="fragments :: sidebar('pipes')"></div><div th:replace="fragments :: topbar('管道档案')"></div><main class="main">
<div class="page-title"><div><h1>管道档案管理</h1><p>管线基础资料、设计参数、建设年份及运行状态统一管理</p></div><a class="btn" href="/pipes/new">＋ 新增管线</a></div>
<div th:if="${message}" class="notice" th:text="${message}"></div>
<section class="card"><div class="toolbar"><div><h3 style="margin:0 0 5px">管线档案列表</h3><span class="muted">共 <span th:text="${#lists.size(pipes)}">5</span> 条记录 · 支持查询、编辑、删除及 CSV 导出</span></div><div><input id="q" class="search" onkeyup="filterTable('q','pipeTable')" placeholder="搜索编号、名称或区域"> <a class="btn btn-light" href="/pipes/export">导出 CSV</a></div></div>
<div class="table-wrap"><table id="pipeTable"><thead><tr><th>编号</th><th>管线名称</th><th>所属区域</th><th>管径</th><th>材质</th><th>长度(km)</th><th>设计压力</th><th>建设年份</th><th>状态</th><th>操作</th></tr></thead><tbody>
<tr th:each="p:${pipes}"><td th:text="${p.pipe_code}"></td><td th:text="${p.pipe_name}"></td><td th:text="${p.area}"></td><td th:text="${p.diameter}"></td><td th:text="${p.material}"></td><td th:text="${p.length_km}"></td><td th:text="${p.design_pressure}+' MPa'"></td><td th:text="${p.install_year}"></td><td><span class="pill" th:classappend="${p.status=='运行中'}?'':' warn'" th:text="${p.status}"></span></td><td><a class="btn btn-light" th:href="@{'/pipes/edit/'+${p.id}}">编辑</a> <form th:action="@{'/pipes/delete/'+${p.id}}" method="post" style="display:inline" onsubmit="return confirm('确定删除该管线档案吗？')"><button class="btn btn-danger" type="submit">删除</button></form></td></tr>
</tbody></table></div></section></main>
<script>function filterTable(i,t){var q=document.getElementById(i).value.toLowerCase();document.querySelectorAll('#'+t+' tbody tr').forEach(function(r){r.style.display=r.innerText.toLowerCase().indexOf(q)>-1?'':'none';});}</script></body></html>
