<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 - 智慧热力管网</title><link rel="stylesheet" th:href="@{/css/app.css}">
<style>
.login-bg{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 15%,#245b83 0,#142e4e 35%,#0c1b31 80%);padding:20px}.login-box{width:min(420px,100%);background:#fff;border-radius:18px;padding:38px;box-shadow:0 24px 80px #07132688}.login-box h1{font-size:23px;margin:0 0 8px}.login-box p{color:#8b99ad;font-size:12px;margin:0 0 25px}.login-box label{display:block;font-size:12px;color:#66778d;margin:15px 0 7px}.login-box input{width:100%;padding:13px;border:1px solid #e0e7ef;border-radius:8px}.login-box button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:linear-gradient(100deg,#277bd8,#1a9ac6);color:white;font-weight:700}.login-error{color:#d85f5f;background:#fff1f1;padding:10px;border-radius:7px;font-size:12px}.login-hint{margin-top:18px;padding:10px;background:#f3f8fd;border-radius:7px;color:#6f8298;font-size:11px}
</style></head><body><div class="login-bg"><form class="login-box" method="post" th:action="@{/login}">
<div style="display:flex;align-items:center;gap:13px;margin-bottom:30px"><div class="brand-icon">热</div><div><b style="font-size:18px">智慧热力管网</b><small style="display:block;color:#8b99ad;font-size:9px;letter-spacing:1px;margin-top:4px">HEAT NETWORK MANAGEMENT</small></div></div>
<h1>欢迎登录</h1><p>供热管网运行监测与运维管理平台</p><div th:if="${error}" class="login-error" th:text="${error}"></div>
<label>管理员账号</label><input name="username" value="admin" required><label>登录密码</label><input name="password" type="password" required>
<button type="submit">登 录 系 统</button><div class="login-hint">演示账号：admin　初始密码：admin123</div></form></div></body></html>
