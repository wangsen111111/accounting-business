<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>维修工单</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="fragments :: sidebar('workorders')"></div><div th:replace="fragments :: topbar('维修工单')"></div><main class="main">
<div class="page-title"><div><h1>维修工单</h1><p>故障登记、任务派发与维修进度跟踪</p></div></div><div th:if="${message}" class="notice" th:text="${message}"></div>
<section class="card" style="margin-bottom:18px"><div class="card-head"><h3>创建维修工单</h3></div><form method="post" th:action="@{/workorders/save}" class="form-grid">
<label>工单标题<input name="title" required></label><label>所属区域<input name="area" required></label><label>优先级<select name="priority"><option>一般</option><option>重要</option><option>紧急</option></select></label><label>维修负责人<input name="assignee" required></label><label style="grid-column:span 2">故障描述<input name="description" required></label><div class="form-actions"><button class="btn">提交工单</button></div></form></section>
<section class="card"><div class="card-head"><h3>工单列表</h3></div><div class="table-wrap"><table><thead><tr><th>编号</th><th>标题</th><th>区域</th><th>优先级</th><th>负责人</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>
<tr th:each="o:${orders}"><td th:text="${o.order_code}"></td><td th:text="${o.title}"></td><td th:text="${o.area}"></td><td th:text="${o.priority}"></td><td th:text="${o.assignee}"></td><td th:text="${o.status}"></td><td th:text="${o.created_at}"></td><td><form method="post" th:action="@{'/workorders/status/'+${o.id}}" style="display:flex;gap:5px"><select name="status"><option>待派工</option><option>处理中</option><option>已完成</option></select><button class="btn btn-light" style="padding:6px 9px">更新</button></form></td></tr>
</tbody></table></div></section></main></body></html>
