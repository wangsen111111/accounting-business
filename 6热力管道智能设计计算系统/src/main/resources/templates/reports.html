<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>综合报表</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="fragments :: sidebar('reports')"></div><div th:replace="fragments :: topbar('综合报表')"></div><main class="main">
<div class="page-title"><div><h1>综合运营报表</h1><p>汇总管网资产、报警与运维业务数据</p></div><button class="btn" onclick="window.print()">打印报表</button></div>
<div class="grid stats"><div class="card stat"><div><div class="stat-label">管道档案</div><div class="stat-value" th:text="${stats.pipe_count}">0</div><div class="stat-foot">条管线记录</div></div><div class="stat-icon">▤</div></div><div class="card stat"><div><div class="stat-label">换热站</div><div class="stat-value" th:text="${stats.station_count}">0</div><div class="stat-foot">座站点档案</div></div><div class="stat-icon">▣</div></div><div class="card stat"><div><div class="stat-label">累计报警</div><div class="stat-value" th:text="${stats.alarm_count}">0</div><div class="stat-foot">条报警记录</div></div><div class="stat-icon">⚑</div></div><div class="card stat"><div><div class="stat-label">维修工单</div><div class="stat-value" th:text="${stats.order_count}">0</div><div class="stat-foot">条工单记录</div></div><div class="stat-icon">▧</div></div></div>
<div class="grid section-grid"><section class="card"><div class="card-head"><h3>工单状态分布</h3></div><table><thead><tr><th>状态</th><th>数量</th></tr></thead><tbody><tr th:each="x:${orders}"><td th:text="${x.status}"></td><td th:text="${x.total}"></td></tr></tbody></table></section><section class="card"><div class="card-head"><h3>报警级别分布</h3></div><table><thead><tr><th>级别</th><th>数量</th></tr></thead><tbody><tr th:each="x:${alarms}"><td th:text="${x.alarm_level}"></td><td th:text="${x.total}"></td></tr></tbody></table><div class="notice">当前待处理报警：<b th:text="${stats.pending_count}">0</b> 条</div></section></div>
<div class="notice">统计结果由 MySQL 业务表汇总生成；不包含现场设备实时数据。</main></body></html>
