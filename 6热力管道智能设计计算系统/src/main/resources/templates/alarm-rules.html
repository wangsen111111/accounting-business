<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>报警规则</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="fragments :: sidebar('rules')"></div><div th:replace="fragments :: topbar('报警规则')"></div><main class="main">
<div class="page-title"><div><h1>报警规则配置</h1><p>维护温度、压力、流量等指标的预警阈值</p></div></div><div th:if="${message}" class="notice" th:text="${message}"></div>
<section class="card"><div class="card-head"><h3>规则列表</h3></div><div class="table-wrap"><table><thead><tr><th>规则名称</th><th>指标</th><th>条件</th><th>阈值</th><th>级别</th><th>启用</th><th>操作</th></tr></thead><tbody>
<tr th:each="r:${rules}"><form method="post" th:action="@{/alarm-rules/save}"><td><input name="rule_name" th:value="${r.rule_name}"></td><td><select name="metric"><option th:selected="${r.metric=='供水温度'}">供水温度</option><option th:selected="${r.metric=='回水温度'}">回水温度</option><option th:selected="${r.metric=='压力'}">压力</option><option th:selected="${r.metric=='流量'}">流量</option></select></td><td><select name="operator"><option value=">" th:selected="${r.operator=='>'}">大于</option><option value="<" th:selected="${r.operator=='<'}">小于</option></select></td><td><input name="threshold_value" type="number" step="0.01" style="width:90px" th:value="${r.threshold_value}"></td><td><select name="alarm_level"><option>一般</option><option>重要</option><option>紧急</option></select></td><td><select name="enabled"><option value="1">启用</option><option value="0">停用</option></select></td><td><input type="hidden" name="id" th:value="${r.id}"><button class="btn btn-light">保存</button></td></form></tr>
</tbody></table></div></section><div class="notice" style="margin-top:16px">此模块保存阈值配置；当前演示版尚未接入实时采集引擎，不会自动触发现场报警。</div></main></body></html>
