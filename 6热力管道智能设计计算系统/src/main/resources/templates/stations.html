<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>换热站管理</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="fragments :: sidebar('stations')"></div><div th:replace="fragments :: topbar('换热站管理')"></div><main class="main">
<div class="page-title"><div><h1>换热站管理</h1><p>换热站运行参数、责任人及设备状态管理</p></div><span class="pill">站点档案</span></div><div th:if="${message}" class="notice" th:text="${message}"></div>
<section class="card" style="margin-bottom:17px"><div class="card-head"><h3>换热站分布示意</h3><span class="muted">管网拓扑示意图 · 非真实 GIS 地图</span></div><div class="map-panel"><div class="map-road"></div><span class="map-node" style="left:22%;top:31%"></span><span class="map-label" style="left:14%;top:19%">城东第一站</span><span class="map-node" style="left:48%;top:48%"></span><span class="map-label" style="left:49%;top:35%">滨河站</span><span class="map-node" style="left:72%;top:27%"></span><span class="map-label" style="left:73%;top:15%">高新园区站</span><span class="map-node" style="left:35%;top:75%;background:#e4a13c"></span><span class="map-label" style="left:36%;top:78%">北城站</span><span class="map-node" style="left:81%;top:69%"></span><span class="map-label" style="left:82%;top:73%">南站</span></div></section>
<section class="card"><div class="toolbar"><h3 style="margin:0">换热站运行列表</h3><input id="q" class="search" onkeyup="filterTable('q','stationTable')" placeholder="搜索站点或区域"></div><div class="table-wrap"><table id="stationTable"><thead><tr><th>站点编号</th><th>换热站名称</th><th>所属区域</th><th>供水温度</th><th>回水温度</th><th>压力(MPa)</th><th>流量(m³/h)</th><th>责任人</th><th>运行状态</th><th>状态维护</th></tr></thead><tbody><tr th:each="s:${stations}"><td th:text="${s.station_code}"></td><td th:text="${s.station_name}"></td><td th:text="${s.area}"></td><td th:text="${s.supply_temp}+' ℃'"></td><td th:text="${s.return_temp}+' ℃'"></td><td th:text="${s.pressure}"></td><td th:text="${s.flow_rate}"></td><td th:text="${s.contact_person}"></td><td><span class="pill" th:classappend="${s.status=='运行中'}?'':' warn'" th:text="${s.status}"></span></td><td><form th:action="@{'/stations/status/'+${s.id}}" method="post"><select name="status" onchange="this.form.submit()" style="padding:6px;border:1px solid #e1e8f0;border-radius:6px"><option value="运行中" th:selected="${s.status=='运行中'}">运行中</option><option value="检修中" th:selected="${s.status=='检修中'}">检修中</option><option value="停运" th:selected="${s.status=='停运'}">停运</option></select></form></td></tr></tbody></table></div></section></main>
<script>function filterTable(i,t){var q=document.getElementById(i).value.toLowerCase();document.querySelectorAll('#'+t+' tbody tr').forEach(function(r){r.style.display=r.innerText.toLowerCase().indexOf(q)>-1?'':'none';});}</script></body></html>
