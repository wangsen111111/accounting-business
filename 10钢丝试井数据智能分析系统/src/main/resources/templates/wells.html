<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>井筒档案 - 钢丝试井智能分析平台</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<aside class="sidebar"><div class="brand">◈ WIRELINE<span style="color:#6fa0ff"> </span><small>INTELLIGENCE PLATFORM</small></div><div class="nav-label">工作台</div><nav class="nav">
<a href="/" >▦　运行总览</a><a href="/wells" class="active">⌖　井筒档案</a><a href="/tests" >◷　试井任务</a><a href="/data" >⌁　数据采集管理</a><a href="/diagnosis">✦　专业诊断中心</a><a href="/logs">◴　操作审计</a><a href="/analysis" >✧　智能分析预警</a><a href="/curves">⌁　曲线分析</a><a href="/compare">▥　井间对比</a><a href="/reports" >▤　分析报告</a><div class="nav-label">系统管理</div><a href="/settings" >⚙　分析规则配置</a></nav><div class="side-bottom">● 系统运行正常<br><br>WIRELINE PLATFORM · V1.0</div></aside>
<div class="main"><header class="topbar"><div class="crumb">油田数字化作业平台　/　井筒档案</div><div class="user"><span class="avatar">A</span><span th:text="${loginUser}">admin</span>　·　<a href="/logout" style="color:#8190a8;text-decoration:none">退出</a></div></header><main class="content"><div class="page-head"><div><h1>井筒档案</h1><div class="sub">统一管理井号、区块、井型及井筒基础信息</div></div></div><div class="form-card"><h3 class="section-title">新增 / 编辑井筒</h3><form method="post" action="/wells/save"><div class="form-grid"><div class="field"><label>井号编码 *</label><input name="wellCode" required placeholder="如 W-002"></div><div class="field"><label>井名称 *</label><input name="wellName" required placeholder="请输入井名"></div><div class="field"><label>所属区块</label><input name="blockName"></div><div class="field"><label>井型</label><select name="wellType"><option>生产井</option><option>注水井</option><option>评价井</option><option>其他</option></select></div><div class="field"><label>地理位置</label><input name="location"></div><div class="field"><label>状态</label><select name="status"><option>在用</option><option>停用</option><option>待维护</option></select></div></div><div class="actions"><button class="btn">保存档案</button></div></form></div><div class="table-card"><table class="table"><thead><tr><th>ID</th><th>井号</th><th>井名称</th><th>区块</th><th>井型</th><th>位置</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.id}"></td><td th:text="${r.well_code}"></td><td th:text="${r.well_name}"></td><td th:text="${r.block_name}"></td><td th:text="${r.well_type}"></td><td th:text="${r.location}"></td><td><span class="badge" th:text="${r.status}"></span></td><td><a th:href="@{'/wells/delete/'+${r.id}}" onclick="return confirm('确认删除该井筒档案？')" style="color:#d6534b">删除</a></td></tr></tbody></table></div></main></div></body></html>
