<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>试井任务 - 钢丝试井智能分析平台</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<aside class="sidebar"><div class="brand">◈ WIRELINE<span style="color:#6fa0ff"> </span><small>INTELLIGENCE PLATFORM</small></div><div class="nav-label">工作台</div><nav class="nav">
<a href="/" >▦　运行总览</a><a href="/wells" >⌖　井筒档案</a><a href="/tests" class="active">◷　试井任务</a><a href="/data" >⌁　数据采集管理</a><a href="/diagnosis">✦　专业诊断中心</a><a href="/logs">◴　操作审计</a><a href="/analysis" >✧　智能分析预警</a><a href="/curves">⌁　曲线分析</a><a href="/compare">▥　井间对比</a><a href="/reports" >▤　分析报告</a><div class="nav-label">系统管理</div><a href="/settings" >⚙　分析规则配置</a></nav><div class="side-bottom">● 系统运行正常<br><br>WIRELINE PLATFORM · V1.0</div></aside>
<div class="main"><header class="topbar"><div class="crumb">油田数字化作业平台　/　试井任务</div><div class="user"><span class="avatar">A</span><span th:text="${loginUser}">admin</span>　·　<a href="/logout" style="color:#8190a8;text-decoration:none">退出</a></div></header><main class="content"><div class="page-head"><div><h1>试井任务</h1><div class="sub">创建钢丝试井作业任务，记录关键作业参数和现场结论</div></div></div><div class="form-card"><h3 class="section-title">任务登记</h3><form method="post" action="/tests/save"><div class="form-grid"><div class="field"><label>关联井筒 *</label><select name="wellId" required><option th:each="w:${wells}" th:value="${w.id}" th:text="${w.well_name}"></option></select></div><div class="field"><label>任务编号 *</label><input name="testNo" required placeholder="WL-2026-002"></div><div class="field"><label>测试日期</label><input name="testDate" type="date" required></div><div class="field"><label>作业人员</label><input name="operator"></div><div class="field"><label>工具型号</label><input name="toolModel"></div><div class="field"><label>最大测试深度(m)</label><input name="maxDepth" type="number" step="0.1"></div><div class="field"><label>钢丝张力(kN)</label><input name="cableTension" type="number" step="0.01"></div><div class="field"><label>现场结论</label><input name="conclusion"></div></div><div class="actions"><button class="btn">保存试井任务</button><a href="/diagnosis">✦　专业诊断中心</a><a href="/logs">◴　操作审计</a><a href="/analysis" class="btn light">进入智能分析</a></div></form></div><div class="table-card"><table class="table"><thead><tr><th>任务编号</th><th>井名称</th><th>日期</th><th>作业人员</th><th>工具型号</th><th>最大深度</th><th>张力(kN)</th><th>分析等级</th><th>操作</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.test_no}"></td><td th:text="${r.well_name}"></td><td th:text="${r.test_date}"></td><td th:text="${r.operator}"></td><td th:text="${r.tool_model}"></td><td th:text="${r.max_depth}"></td><td th:text="${r.cable_tension}"></td><td><span class="badge warn" th:text="${r.risk_level==null?'待分析':r.risk_level}"></span></td><td><a th:href="@{'/tests/delete/'+${r.id}}" onclick="return confirm('确认删除？')" style="color:#d6534b">删除</a></td></tr></tbody></table></div></main></div></body></html>
