server:
  tomcat:
    uri-encoding: UTF-8
    max-http-header-size: 102400
  port: 9999
# server.max-http-header-size=102400
#  servlet:
#    context-path: /api
mybatis-plus:
  # 支持统配符 * 或者 ; 分割
  typeEnumsPackage: com.ywjs.jcsy.common.enums
#  type-handlers-packag: com.ywjs.jcsy.common.handler
  # MyBatis 配置文件位置，如果您有单独的 MyBatis 配置，请将其路径配置到 configLocation 中。
  # config-location: classpath:mybatis-config.xml
  # MyBatis Mapper 所对应的 XML 文件位置，如果您在 Mapper 中有自定义方法
  mapper-locations: classpath:mapper/*.xml
  # MyBaits 别名包扫描路径，通过该属性可以给包中的类注册别名 实体扫描，多个package用逗号或者分号分隔
  type-aliases-package:  com.ywjs.jcsy.entity
  #  # 配置扫描通用枚举 # 支持统配符 * 或者 ; 分割
  #type-enums-package: com.abbottliu.sys.enums,com.abbottliu.enums
  # 启动时是否检查 MyBatis XML 文件的存在，默认不检查
  check-config-location: false
  #  ExecutorType.SIMPLE：该执行器类型不做特殊的事情，为每个语句的执行创建一个新的预处理语句（PreparedStatement）
  #  ExecutorType.REUSE：该执行器类型会复用预处理语句（PreparedStatement）
  #  ExecutorType.BATCH：该执行器类型会批量执行所有的更新语句
  executor-type: simple
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
    # 配置slq打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 是否开启自动驼峰命名规则（camel case）映射
    map-underscore-to-camel-case: true
    #配置JdbcTypeForNull, oracle数据库必须配置
    jdbc-type-for-null: null
#    cache-enabled: true
  global-config:
    #驼峰下划线转换
    column-underline: true
    db-config:
      #      数据库类型,默认值为未知的数据库类型 db-type: mysql
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-handlers-package: com.ywjs.jcsy.common.handler.typehandler
spring:
#  logging:
#    level:
#      me.wuwenbin.noteblogv5.mapper: DEBUG
  freemarker:
    suffix: .ftl
    template-loader-path: classpath:/templates
  thymeleaf:
    cache: false
  application:
    name: jcsy
  datasource:
    #    name: dataSource1 #如果存在多个数据源，监控的时候可以通过名字来区分开来。如果没有配置，将会生成一个名字，格式是："DataSource-" + System.identityHashCode(this)
#    type: com.alibaba.druid.pool.DruidDataSource :src/main/resources/db/JCSY-SQLite.db
    url: jdbc:sqlite:src/main/resources/db/JCSY-SQLite.db
#    url: jdbc:sqlite:E:/工作文件/WorkCode/jcsy/db/JCSY-SQLite.db
    driver-class-name: org.sqlite.JDBC
  devtools:
    restart:
      #热部署生效
      enabled: true
      #classpath目录下的WEB-INF文件夹内容修改不重启
      exclude: WEB-INF/**

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 2000MB #单个文件上传大小
      max-request-size: 6000MB #连续上传文件大小
      enabled: true
  # 字符编码配置
  http:
    encoding:
      charset: utf-8
      force: true
      enabled: true
file:
  # 对外访问的资源路径
  staticAccessPath: /file/static/** # /smallapple/** 虚拟访问路径#静态资源对外暴露的访问路径 http://127.0.0.1:9999/file/static/1.txt
# 线程池设置
jcsy:
  character: utf-8
  thread:
    core-size: 20
    max-size: 2000
    keep-alive-time: 10
